<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="servingTitle servingDesc">
  <title id="servingTitle">Continental Cake Shop Canberra — Cake Sizes and Serving Guide</title>
  <desc id="servingDesc">Visual portion chart comparing Half Cheesecake (serves 6, from $22.95), Midi Cake (serves 8, from $34.95), Full Cheesecake (serves 12, from $39.95), Full Cake (serves 14, from $44.95), and Profiterole Towers or XL Cakes (serves 15 to 20, from $55).</desc>
  <rect width="960" height="340" rx="20" fill="#F4FBF8"/>
  <rect x="12" y="12" width="936" height="316" rx="14" fill="#FFFFFF" stroke="#D7ECE6" stroke-width="1.5"/>
  <text x="480" y="48" text-anchor="middle" font-family="Outfit, 'DM Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#162320">Canberra Cake Size &amp; Portion Guide (100% Halal Range)</text>
  <text x="480" y="70" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="13" fill="#526661">Approximate dessert portions per cake — free custom message included on celebration cakes</text>

  <!-- Card 1: Half Cheesecake -->
  <g transform="translate(34, 92)">
    <rect width="166" height="214" rx="14" fill="#F8FCFA" stroke="#E0EFEA"/>
    <path d="M45,78 A38,38 0 0,1 121,78 Z" fill="#58DCBF" stroke="#1E9B82" stroke-width="2.2"/>
    <line x1="83" y1="78" x2="83" y2="40" stroke="#1E9B82" stroke-width="1.3" stroke-dasharray="3,2"/>
    <line x1="83" y1="78" x2="55" y2="52" stroke="#1E9B82" stroke-width="1.3" stroke-dasharray="3,2"/>
    <line x1="83" y1="78" x2="111" y2="52" stroke="#1E9B82" stroke-width="1.3" stroke-dasharray="3,2"/>
    <text x="83" y="114" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#162320">Half Cheesecake</text>
    <text x="83" y="136" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#1E9B82">Serves ~6</text>
    <text x="83" y="158" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">Baked &amp; Continental</text>
    <text x="83" y="176" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">cheesecakes</text>
    <rect x="28" y="186" width="110" height="20" rx="10" fill="#E6F7F2"/>
    <text x="83" y="200" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#147561">From $22.95</text>
  </g>

  <!-- Card 2: Midi Cake -->
  <g transform="translate(216, 92)">
    <rect width="166" height="214" rx="14" fill="#F8FCFA" stroke="#E0EFEA"/>
    <circle cx="83" cy="60" r="32" fill="#58DCBF" stroke="#1E9B82" stroke-width="2.2"/>
    <line x1="51" y1="60" x2="115" y2="60" stroke="#1E9B82" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="83" y1="28" x2="83" y2="92" stroke="#1E9B82" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="60" y1="37" x2="106" y2="83" stroke="#1E9B82" stroke-width="1.2" stroke-dasharray="3,2"/>
    <line x1="106" y1="37" x2="60" y2="83" stroke="#1E9B82" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="83" y="114" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#162320">Midi Cake</text>
    <text x="83" y="136" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#1E9B82">Serves ~8</text>
    <text x="83" y="158" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">Tortes, Mud, Velvet</text>
    <text x="83" y="176" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">&amp; Tea Cakes</text>
    <rect x="28" y="186" width="110" height="20" rx="10" fill="#E6F7F2"/>
    <text x="83" y="200" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#147561">From $34.95</text>
  </g>

  <!-- Card 3: Full Cheesecake -->
  <g transform="translate(398, 92)">
    <rect width="166" height="214" rx="14" fill="#F8FCFA" stroke="#E0EFEA"/>
    <circle cx="83" cy="60" r="36" fill="#3CC7A9" stroke="#1E9B82" stroke-width="2.2"/>
    <line x1="47" y1="60" x2="119" y2="60" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="83" y1="24" x2="83" y2="96" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="52" y1="42" x2="114" y2="78" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="114" y1="42" x2="52" y2="78" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="65" y1="29" x2="101" y2="91" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="101" y1="29" x2="65" y2="91" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="83" y="114" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#162320">Full Cheesecake</text>
    <text x="83" y="136" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#1E9B82">Serves ~12</text>
    <text x="83" y="158" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">Whole round Baked</text>
    <text x="83" y="176" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">or Set Cheesecake</text>
    <rect x="28" y="186" width="110" height="20" rx="10" fill="#E6F7F2"/>
    <text x="83" y="200" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#147561">From $39.95</text>
  </g>

  <!-- Card 4: Full Cake -->
  <g transform="translate(580, 92)">
    <rect width="166" height="214" rx="14" fill="#F8FCFA" stroke="#1E9B82" stroke-width="1.6"/>
    <circle cx="83" cy="58" r="40" fill="#1E9B82" stroke="#147561" stroke-width="2.2"/>
    <circle cx="83" cy="58" r="16" fill="none" stroke="#A7F0DF" stroke-width="1.3" stroke-dasharray="3,2"/>
    <line x1="43" y1="58" x2="123" y2="58" stroke="#A7F0DF" stroke-width="1.2"/>
    <line x1="83" y1="18" x2="83" y2="98" stroke="#A7F0DF" stroke-width="1.2"/>
    <line x1="55" y1="30" x2="111" y2="86" stroke="#A7F0DF" stroke-width="1.2"/>
    <line x1="111" y1="30" x2="55" y2="86" stroke="#A7F0DF" stroke-width="1.2"/>
    <text x="83" y="114" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#162320">Full Cake</text>
    <text x="83" y="136" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#1E9B82">Serves ~14</text>
    <text x="83" y="158" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">Most popular party</text>
    <text x="83" y="176" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">&amp; birthday size</text>
    <rect x="28" y="186" width="110" height="20" rx="10" fill="#1E9B82"/>
    <text x="83" y="200" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">From $44.95</text>
  </g>

  <!-- Card 5: XL & Towers -->
  <g transform="translate(762, 92)">
    <rect width="164" height="214" rx="14" fill="#F8FCFA" stroke="#E0EFEA"/>
    <polygon points="82,20 48,94 116,94" fill="#58DCBF" stroke="#1E9B82" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="82" cy="38" r="7" fill="#FFFFFF" opacity=".85"/>
    <circle cx="73" cy="58" r="7" fill="#FFFFFF" opacity=".85"/>
    <circle cx="91" cy="58" r="7" fill="#FFFFFF" opacity=".85"/>
    <circle cx="64" cy="79" r="7" fill="#FFFFFF" opacity=".85"/>
    <circle cx="82" cy="79" r="7" fill="#FFFFFF" opacity=".85"/>
    <circle cx="100" cy="79" r="7" fill="#FFFFFF" opacity=".85"/>
    <text x="82" y="114" text-anchor="middle" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="#162320">XL &amp; Towers</text>
    <text x="82" y="136" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#1E9B82">Serves 15 – 20</text>
    <text x="82" y="158" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">XL Rainbow Torte &amp;</text>
    <text x="82" y="176" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12.5" fill="#526661">Profiterole Towers</text>
    <rect x="27" y="186" width="110" height="20" rx="10" fill="#E6F7F2"/>
    <text x="82" y="200" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#147561">From $55.00</text>
  </g>
</svg>
